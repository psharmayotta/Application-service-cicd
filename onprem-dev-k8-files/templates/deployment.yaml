apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "q0-uiapi.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- with .Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: cloudian-ca
          configMap:
            name: cloudian-ca-bundle
      containers:
        - name: {{ .Values.container.name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            {{- range .Values.container.ports }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
            {{- end }}
          volumeMounts:
            - name: cloudian-ca
              mountPath: /etc/ssl/certs/cloudian-ca-bundle.pem
              subPath: cloudian-ca-bundle.pem
              readOnly: true
          envFrom:
            - configMapRef:
                name: all-configmap
          env:
            - name: NODE_EXTRA_CA_CERTS
              value: "/etc/ssl/certs/cloudian-ca-bundle.pem"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo-dev.dev.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.container.name | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=dev,k8s.namespace.name=dev"
            - name: OTEL_TRACES_SAMPLER
              value: "always_on"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.probes.startup }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
